name: Content digest

on:
  schedule:
    # 05:23 UTC = 6:23am London during BST. Deliberately early and on an odd
    # minute: GitHub only runs scheduled jobs on a best-effort basis, and jobs
    # on the hour / half-hour queue behind everyone else's. At 06:30 UTC this
    # was landing 36-171 min late (8:06-10:21am London). The buffer means even
    # a slow queue should still deliver before 7:30am.
    # NB: GitHub cron is fixed UTC and does NOT follow DST — in winter (GMT)
    # this fires at 5:23am local. Bump to "23 6 * * *" then if you want the
    # same local time year-round.
    - cron: "23 5 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Needed so the job can commit the updated seen.json back to the repo.
permissions:
  contents: write

concurrency:
  group: content-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}   # optional; blank falls back to the default
        run: python main.py

      - name: Persist seen.json
        if: always()   # save state even if the send step errored
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen.json [skip ci]"
            git push
          else
            echo "No change to seen.json."
          fi
