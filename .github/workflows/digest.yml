name: Winnow digest

on:
  schedule:
    # 05:23 UTC = 6:23am London during BST. Deliberately early and on an odd
    # minute: GitHub only runs scheduled jobs on a best-effort basis, and jobs
    # on the hour / half-hour queue behind everyone else's. At 06:30 UTC this
    # was landing 36-171 min late (8:06-10:21am London). The buffer means even
    # a slow queue should still deliver before 7:30am.
    # NB: GitHub cron is fixed UTC and does NOT follow DST — in winter (GMT)
    # this fires at 5:23am local. Bump to "23 6 * * *" then if you want the
    # same local time year-round.
    - cron: "23 5 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Read-only: dedup state round-trips through the Actions cache, not a git commit.
permissions:
  contents: read

concurrency:
  group: content-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Rolling cache: each run saves under a unique key, and restore-keys picks up
      # the most recent previous entry. If nothing is found (first run, or a cache
      # evicted after 7 idle days) state.py falls back to the committed seen.seed.json
      # so a cold start can't re-analyze the whole backlog.
      - name: Restore dedup state
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      # The vault profile describes the owner's private notes, so it is gitignored
      # and injected here instead. Absent secret => the agent runs without vault
      # context, which is a supported mode (see agent.py VAULT_BLOCK).
      - name: Materialize vault profile
        env:
          VAULT_CONTEXT: ${{ secrets.VAULT_CONTEXT }}
        run: |
          printf '%s' "$VAULT_CONTEXT" > vault_context.md
          if [[ -s vault_context.md ]]; then
            echo "Vault profile present ($(wc -c < vault_context.md) bytes) — vault-aware ranking on."
          else
            echo "VAULT_CONTEXT secret not set — running without vault context."
          fi

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}   # optional; blank falls back to the default
        run: python main.py
